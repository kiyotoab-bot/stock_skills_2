# PFターゲットアロケーション定義 (KIK-685)
# 3ラウンド × 6者（PM/エンジニア/投資戦略家/GPT/Gemini/Grok）の議論で確定
# SSoT: 全エージェント（HC/Strategist/Reviewer/Risk Assessor）がこのファイルを参照する

# --- 役割別ターゲット（4LLMスワム承認済み 2026-04-24 / hedge枠は 2026-07-28 に廃止） ---
#
# ⚠️ hedge 枠の廃止について（2026-07-28、実測に基づくユーザー判断）
#
# 従来 hedge: [5,5] を置いていたが、2年480日の実測で「5%という枠では
# どの商品を置いても効果が誤差の範囲」と判明したため廃止し、cash に統合した。
#
# PF最悪48日での実測（hedge枠5%=¥429,246 を各候補に置いた場合の 2024-08-05 型
# ショック〈PF株式 -13.27% = ¥-900,840〉での保護額）:
#   金ETF(1328.T)      最悪日 -1.59% / 円主導日 -1.46% → 保護 ¥-24,159（悪化させる）
#   日経Wインバース      最悪日 +4.87% / 円主導日 +7.92% → 保護 ¥+112,826
#                       ただし1年保有で -71.0%（¥-300,457）。保険料が保険金の2.7倍
#   NF国内債券(2510.T)  最悪日 +0.11% / 円主導日 +0.62% → 保護 ¥+6,342（損失の0.7%）
#   iS米国債ヘッジ有     最悪日 +0.10% / 円主導日 +0.41% → 保護 ¥+6,044（同0.7%）
#
# 結論: 現金は円主導ショックで唯一 0% を保証する資産（円建てゆえ円高で目減りしない）。
#       5%枠の管理コストに見合う保護効果を持つ商品が存在しない。
#
# ⚠️ 再導入する場合の条件: 枠を 5% ではなく最低 15% 以上取れること。
#    上記の保護額は枠サイズに比例するため、5%では何を置いても誤差にしかならない。
# --- 2026-08-05 改訂: growth 比率の引き上げ（案B） ---
#
# 目標「総資産1000万円」の期限を 2030年3月末 に設定し、そこから逆算して配分を決めた。
#
# 前提となった試算（起点 2026-08-05 総資産 ¥7,875,791 / うち現金 ¥6,296,491 = 80%）:
#   バケット別の期待リターン想定
#     income 年率 7.5%（配当3.5% + 値上がり4.0%）
#     growth 年率18.0%（強気）／ 12.0%（保守）
#   旧配分（income50/growth27/cash23）の株式ブレンド年率
#     強気 11.18% → 2029年11月到達 / 保守  9.08% → 2030年 6月到達
#   新配分（income40/growth40/cash20）の株式ブレンド年率
#     強気 12.75% → 2029年 6月到達 / 保守  9.75% → **2030年 3月到達**
#   → 保守シナリオでも期限内に届く配分として growth を 27% → 40% に引き上げた。
#     強気シナリオなら 2029年6月と9ヶ月前倒しになる（上振れ余地）。
#
# ⚠️ リスクは上がる。年率σ（income22%/growth40%/相関0.6 の概算）:
#     旧配分 総資産σ 19.5% → -1σの年 ¥6,340,113（-19.5%）
#     新配分 総資産σ 22.4% → -1σの年 ¥6,110,489（-22.4%）
#   さらに growth 70% 案（案E・2028年6月到達）は σ30.1% / -1σ ¥5,505,492 となるため却下した。
#
# ⚠️ 必要リターンは「総資産」ではなく「株式部分」に対して計算すること。
#   総資産全体が複利で増える前提で計算すると必要年率を大幅に過小評価する
#   （2026-08-05 に実際にこの誤りを犯し、必要年率を 8.6% と誤報告した。正しくは 12.1%）。
role_targets:
  normal:
    income: [35, 45]      # % 旧 [45, 55]
    growth: [35, 45]      # 旧 [25, 30] ← 2026-08-05 引き上げ
    cash: [15, 25]        # 据え置き。旧 [15,20] + 旧 hedge [5,5] を統合
  risk_off:
    income: [40, 50]      # 旧 [50, 55]
    growth: [15, 25]      # 旧 [10, 20]
    cash: [30, 45]        # 据え置き。旧 cash[25,35] + 旧 hedge[5,10] を統合
  pre_160_mode:
    # 大底圏シグナル（#160）検出時の仕込み準備モード
    # 発動条件: Health Checkerが大底圏4条件（BB-4σ+S3+RSI<30+PBR割安）を検出した場合
    # 目的: 倍買い3弾（100→200→400株）を全弾打てる余力を確保する
    cash: [55, 70]        # 60%前後を目安（Shoさん推奨「6割以上」）。旧hedge[0,5]を統合
    income: [20, 30]      # 旧 [25, 35]
    growth: [10, 20]      # 旧 [5, 15]
  trigger_to_pre_160:
    - "Health Checker の大底圏4条件 4/4 検出"
    - "VIX がピークから 20% 以上低下済み"
  trigger_to_risk_off:
    - "リスク判定スコア -3以下"
    - "VIX > 25"
    - "強制ルール発動（VIX>40, F&G<10, WTI>$110）"
  jepi_classification: "ハイブリッド。保有比率を50:50でインカム+グロースに分割カウント"

# --- 集中度制約（2026-08-07 改訂: 確信度加重の集中投資） ---
#
# ⚠️ 分母は **株式部分（equity）**。総資産比ではない。
#
# 2026-08-07 まで分母が未定義で、同じPFが日によって逆の判定になっていた:
#   日次レポート(6/2, 6/5) は総資産比 / 週次レポート(7/27) は株式比
#   実例 2026-08-06: 8031.T 三井物産は 総資産比 6.2% / 株式比 30.0%
#        single_stock limit 15% に対し「全て通過」と「3銘柄超過」で結論が逆転していた
# 現金は集中リスクを持たないので分母に入れない。現金比率が高い再構築期に
# 総資産比で見ると、どんなに偏っていても永久に警告が出ない。
# 総資産比は参考値として併記するだけで、判定には使わない。
concentration:
  basis: equity           # equity | total_assets — 判定に使う分母
  single_stock:
    # 通常銘柄: 従来どおり。集中投資でも「なんとなく買った銘柄」は膨らませない
    normal:
      warn: 12
      limit: 15
    # conviction 銘柄: 下の conviction_criteria を **全て** 満たすものだけ
    conviction:
      warn: 20
      limit: 25
  top3_stocks:
    warn: 60              # 旧 30。conviction 25%×2 + 通常15% = 65% を想定
    limit: 70
  sector:
    warn: 35              # 旧 20。conviction 2銘柄が同セクターだと 50% に達する
    limit: 45

# --- conviction 認定の条件（2026-08-07 ユーザー判断）---
#
# 上限を 15% → 25% に引き上げる代わりに、conviction は「気に入っている」ではなく
# **満たすべき条件**にする。3つ全てを満たさない限り normal 扱い。
conviction_criteria:
  - id: CV1
    check: "一次情報で検証済み（J-Quants 会社予想 / 決算短信 / 会社発表）"
    why: "yfinance の予想値は検証5銘柄中2件が誤りだった。集中する銘柄ほど誤データの被害が大きい"
  - id: CV2
    check: "投資テーゼが thesis ノートとして文書化されている"
    why: "なぜ持つかを書けない銘柄に25%を張らない。後から検証もできない"
  - id: CV3
    check: "exit 条件が明記されている（ストップ値 or 撤退条件）"
    why: "集中とストップ規律は表裏。1銘柄25%で撤退基準が無いと回復不能な損失になりうる"

# --- ⚠️ conviction_override の扱い ---
#
# ユーザーが「テーゼ関係なく保持」と明言した銘柄（7453.T 良品計画 / 8267.T イオン）は
# CV3（exit条件）を満たさないが、**上限判定の対象外**とする。
#
# 重要: 集中度の上限は「**これ以上買わない**」の基準であって、売却・トリムの根拠ではない。
#   ・上限超過 → 新規買い増しを止める。売却提案は**しない**
#   ・conviction_override 銘柄には売却・トリム提案を一切しない（ユーザー指示）
#   実例: 7453.T 良品計画は 2026-08-06 時点で株式比 26.8% と conviction limit 25% を
#         超えているが、これは超過を理由にトリムする対象ではない。買い増しをしないだけ。
conviction_override:
  exempt_from_limit: true
  never_propose_sell: true

# 上限25%の含意: フル投資時の最小銘柄数は 4。
# conviction 2銘柄(25/20%) + 通常 3銘柄(15/15/15%) = 5銘柄 90% が想定形。

# --- 通貨制約 ---
currency:
  USD:
    warn: 50
    limit: 60             # lesson「USD60%超に注意」
  JPY:
    floor: 25             # 生活通貨の最低ライン

# --- 地域制約 ---
geography:
  min_regions: 3          # 最低3地域保有
  single_region:
    warn: 50
    limit: 60

# --- 規模別制約 (KIK-725) ---
cap_size:
  small_cap:
    warn: 5               # % — PF全体に占める小型株比率
    limit: 10
  single_stock_small: 3    # % — 小型株1銘柄あたりの上限
  definition:
    small_cap_threshold_jpy: 100000000000   # 1000億円以下 = 小型
    small_cap_threshold_usd: 1000000000     # $1B以下 = 小型

# --- 乖離判定の3段階 ---
deviation_levels:
  green: "warn未満 — 正常"
  yellow: "warn以上 limit未満 — 注意"
  red: "limit以上 — 警告"

# --- ポリシー ---
policy:
  auto_rebalance: false   # 自動リバランス強制なし
  alert_only: true        # 警告のみ、最終判断はユーザー
