# 実行前チェックリスト（KIK-731）
#
# 2026年8月の3〜6日に、私（アシスタント）の作業で15件の見落とし・誤りが発生した。
# その全件を「どのチェックがあれば防げたか」に変換したものがこのファイル。
# 精神論ではなく、**実際に起きた失敗**に1対1で対応させている。
#
# 使い方: 各 checklist の apply_to に書かれた場面で、上から順に確認する。
# 機械化できるものは code 欄に検証手段を書いた。code があるものは必ず実行する。

meta:
  created: "2026-08-06"
  source: "2026-08-03〜06 に発生した15件の失敗"
  principle: |
    1. 「値が取れた」と「値が正しい」は別。出所を確認していない数値で判断しない
    2. 自分が予定に入れた作業は、実行するまで完了ではない
    3. ルールを適用する前に、そのルールの前提（規模・期間・単位）を確認する
    4. 比較する2つの数字が同じものを指しているか確認する

# ---------------------------------------------------------------------------
data_quality:
  apply_to: ["銘柄の評価", "スクリーニング", "発注前", "日次/週次チェック"]
  items:
    - id: DQ1
      check: "日本株の予想PER・予想配当は会社予想（J-Quants）か"
      why: "yfinance の予想値は検証5銘柄中2件（40%）が誤りだった"
      incident: "6436.T アマノ 予想配当250円（会社予想180円）→ 利回り6.44%と誤認し推奨に載せた"
      code: "get_stock_info() の forecast_source が 'jquants' か確認"
    - id: DQ2
      check: "forecast_suspect / dividend_yield_suspect が True でないか"
      why: "yfinanceと会社予想の乖離。Trueなら一次情報で裏を取るまで判断に使わない"
      incident: "6141.T DMG森精機 会社PER40.0 vs yf13.1（3.1倍）/ 5401.T 日本製鉄 12.2 vs 1.2（10倍）"
      code: "get_stock_info() の forecast_suspect / dividend_yield_suspect"
    - id: DQ3
      check: "極端に良く見える数字ほど疑う（予想PER<8、利回り>6%、EPS急増）"
      why: "誤データは常に『魅力的な方向』に出る。魅力的だから拾ってしまう"
      incident: "6701.T 日本電気 予想PER 6.4 を『極端に割安』と報告（実際は21.5）。当初 PER<5 で実装したため 6.4 が素通りしていた"
      code: "src/data/checklist_review.py の DQ3_PER_FLOOR"
    - id: DQ4
      check: "データの基準日を確認したか。最新バーが null で欠けていないか"
      why: "yfinance は最新バーを Close=null で返すことがある"
      incident: "2026-08-04 に84銘柄中83銘柄の最終日が7/31に後退。dropnaすると2日古いデータで判断していた"
      code: "history().dropna(subset=['Close']) の最終日を出力。marketState と regularMarketTime で補完"
    - id: DQ5
      check: "キャッシュを消したつもりが消えていないか"
      why: "キャッシュのファイル名は 6436_T.json（ドット→アンダースコア）"
      incident: "手で組んだ 'data/cache/6436.T.json' は存在せず、削除がずっと空振りしていた"
      code: "src.data.yahoo_client._cache._cache_path(symbol) を使う。自分でパスを組まない"
    - id: DQ6
      check: "単位を確認したか（%か比率か、円か千円か、億か百万か）"
      why: "yfinance の dividendYield はパーセント単位（0.84 = 0.84%）"
      incident: "『>1なら100で割る』という誤った正規化を書き、NECの配当を84%と表示。年間配当が9倍になった"
      code: "src/data/yahoo_client/_normalize.py の _normalize_ratio は常に100で割る"
    - id: DQ7
      check: "forecast_source が jquants でも、会社予想EPS（per_forward_company）が入っているか"
      why: "IFRS/Non-GAAP開示企業は決算短信の標準EPS欄が空。配当だけ J-Quants から入るため DQ1 は PASS するが、PER は yfinance の誤値のまま残る"
      incident: "2026-08-07 週次で 6701.T 日本電気の会社PERを 6.5 と表示。実際は Non-GAAP当期利益2,900億 → 21.5倍。DQ1もDQ3も発火しなかった"
      code: "src/data/checklist_review.py check_data_quality の DQ7"

# ---------------------------------------------------------------------------
comparison:
  apply_to: ["改訂率の算出", "前年比", "進捗率", "リターン計算"]
  items:
    - id: CP1
      check: "比較する2つの数字は同じ決算期のものか"
      why: "1Q開示は新しい決算期の予想。前の3Q開示と比べると『改訂』ではなく『前期比』を測る"
      incident: "日立 +18.4% / ローム +190% を『上方修正』と誤報告しかけた"
      code: "analyze_revisions() を使う。get_forecast_history() の隣接2件を直接比較しない"
    - id: CP2
      check: "期初計画は前期の期末開示の NxF*（翌期予想）列から取ったか"
      why: "3月決算企業は今期の開示が1Qの1件だけで、F*列だけでは改訂を測れない"
      incident: "富士通を『-27.1%の下方修正』と誤判定（実際は据え置き）。ミネベアを『下方修正』（実際は+4.8%上方修正）"
    - id: CP3
      check: "『前期比』は予想同士か、実績との比較か"
      why: "会社が保守的に予想して上振れると符号が逆転する"
      incident: "アイシン 前期予想比 +20.0% / 前期実績比 -12.6%"
    - id: CP4
      check: "必要リターンは『株式部分』に対してか、キャッシュ込みの総資産に対してか"
      why: "キャッシュは複利で増えない。総資産ベースで計算すると必要年率を大幅に過小評価する"
      incident: "2029年6月末を『年率8.6%』と報告（正しくは12.1%）"
    - id: CP5
      check: "進捗率は季節性を考慮したか。単純に1/4と比べていないか"
      why: "下期偏重の企業では1Q進捗が低いのは正常"
      incident: "三菱商事の進捗率27.1%を5年平均32.2%と比べて『見劣り』としたが、通期計画が+37.4%と野心的なだけだった"

# ---------------------------------------------------------------------------
rules:
  apply_to: ["売買可否の判定", "ストップ設定", "配分判定"]
  items:
    - id: RL1
      check: "PF規模ティアを実測で確認したか（total assets / USDJPY）"
      why: "small(〜$50K) / medium / large で冷却期間・月次上限・使える機能が変わる"
      incident: "mediumと思い込んで冷却2週・月4回で計画。実際はsmallで4週・月1回だった"
      code: "総資産 ÷ USDJPY を計算し scale_rules と突合"
    - id: RL2
      check: "適用するルールの原文を読んだか。要約や記憶で判断していないか"
      why: "sector_matrix.yaml が壊れていて safe_load できず、内容を確認しないまま運用していた"
      incident: "scale_rules を一度も読まずに medium 前提で3ヶ月の投入計画を作った"
    - id: RL3
      check: "計画の各部分が互いに矛盾していないか"
      why: "同一ノート内で『月1回』と『9月4銘柄』を両方書いていた"
      incident: "案B確定ノートが自己矛盾。medium時代の3段階計画を引きずっていた"
    - id: RL4
      check: "ストップは 逆指値 か。指値売りではないか"
      why: "指値売りを現在値より下に置くと即時約定する（買いはその鏡像）"
      incident: "2026-08-04 に7銘柄800株が寄付きで一斉約定。原因は注文種別を指示していなかったこと"
    - id: RL5
      check: "ストップの距離を日次σ倍で測ったか。%で判断していないか"
      why: "同じ-3%でも σ1.6%なら1.9σ、σ3.1%なら1.0σ。%だと高ボラ銘柄が常に『近い』と誤検知"
      incident: "9364.T のストップが0.64日σ（1週間以内の発火確率53%）だった"
      code: "detect_alerts(stop_levels=get_stop_levels()) が σ倍で判定する"
    - id: RL6
      check: "ストップ値を変更したら、証券会社の旧注文の取消も案内したか"
      why: "記録だけ更新しても口座の注文は残る"
      incident: "9364.T を¥5,063→¥4,801に是正したが、口座の旧注文には触れなかった"

# ---------------------------------------------------------------------------
followthrough:
  apply_to: ["すべての場面"]
  items:
    - id: FT1
      check: "過去に自分が『○日に再評価する』と書いた項目を、実行したか"
      why: "予定を書いただけで実行しないと、その予定を前提に意思決定が進む"
      incident: "7/28に『7259.Tを8/3に再評価』と書いたが実行せず、8/3に約定した"
      code: "load_notes(note_type='target') の trigger / expected_action を日付で洗う"
    - id: FT2
      check: "『既知の穴』と自分が書いたものを、コードで確認したか"
      why: "毎回注記していたが、実際にコードを見たのは指摘された後だった"
      incident: "detect_alerts が stop_loss を読まないことを、コードで確認したのは4日目"
    - id: FT3
      check: "報告した数値の前提が、その後変わっていないか"
      why: "前提が変われば結論も変わる。古い前提のまま話を進めない"
      incident: "『金の上昇が気になる』と述べた2時間後に金は反落し、リスクオフ兆候ではなかった"

# ---------------------------------------------------------------------------
reporting:
  apply_to: ["WLチェック", "日次/週次チェック", "候補の提示"]
  items:
    - id: RP1
      check: "全銘柄に5日リターンを表示したか。前日比だけになっていないか"
      why: "前日比だけだと、数日前の決算急落を見逃す"
      incident: "7259.T を『前日-3.6%』とだけ報告し、7/31の-11.71%（1Q決算）を出さなかった"
    - id: RP2
      check: "直近5営業日に単日±7%以上の変動がある銘柄に ⚡ を付けたか"
      why: "イベント駆動の値動きと押し目を区別する"
      code: "WLチェックで max(|日次騰落|) >= 7 を判定"
    - id: RP3
      check: "指値の乖離が縮小・反転した銘柄は、縮小理由を特定したか"
      why: "『乖離が縮んだ＝買い場』ではなく『下がった理由がある』が既定の解釈"
      incident: "7259.T を『撤回した指値¥2,190を置けば即約定する水準』と機会として提示した"
    - id: RP4
      check: "ザラ場値か終値か明記したか。米国指数は日本時間の深夜だとザラ場値"
      why: "終値として報告すると翌日の数字と食い違う"
    - id: RP5
      check: "『〜が原因』と述べる前に、時系列と因果を確認したか"
      why: "一点だけ見て因果を否定・断定しない"
      incident: "8/3の売買について『報告漏れは約定後だから原因ではない』と述べたが、7/7のテーゼ作成と7/28の予定という指示連鎖を見落としていた"

# ---------------------------------------------------------------------------
# 発注前の最終確認（この6項目は毎回必ず通す）
pre_order:
  apply_to: ["発注指示書を出す直前"]
  items:
    - id: PO1
      check: "冷却期間（**買付**起点）と月次上限を、実際の取引履歴から計算したか"
    - id: PO2
      check: "会社予想（J-Quants）で予想PER・予想配当を再取得したか。suspect は False か"
    - id: PO3
      check: "会社予想の改訂方向を analyze_revisions() で再確認したか（決算で変わる）"
    - id: PO4
      check: "中止条件（価格上限など）を現在値と照合したか"
    - id: PO5
      check: "注文種別・株数・有効期限・既存注文の取消要否を明記したか"
    - id: PO6
      check: "取得後のストップ（第1段階のハードストップ）を決めたか"
    - id: PO7
      check: "信用倍率（需給）を確認したか。買い残が厚すぎないか"
      why: "買い残が厚い銘柄は上値で戻り売りに押される。バリュエーションだけでは見えない"
      incident: |
        2026-08-06 まで需給を一度も見ておらず、保有の 8031.T 三井物産が
        信用倍率 38.5倍（買い残が売り残の38倍）だったことに気づいていなかった。
        週次ルーティンの Step 3c に定義はあったが、週次レビュー自体を走らせていなかった。
      code: "tools.jquants.get_stock_margin(symbol) の margin_ratio / wow_change_pct"
      threshold: "15倍以上=注意 / 30倍以上=上値の重石として明確。前週比+50%超の急増も要注意"
