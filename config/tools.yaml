# Tools — エージェント・スキルが参照するツール定義
# 各ツールの関数名・役割・いつ使うかを一元管理する。
# エージェント (agent.md) やスキル (SKILL.md) はこのファイルを参照し、
# ツール一覧をベタ書きしない。

tools:
  yahoo_finance:
    source: tools/yahoo_finance.py
    functions:
      screen_stocks:
        description: "条件に合う銘柄を網羅的にスクリーニング"
        when: "再投資・入替・候補選定時（必須）。AIの知識ベースから手動選定してはならない"
      get_stock_info:
        description: "個別銘柄の指標取得（PER/PBR/ROE/配当利回り/Beta等）"
        when: "候補の詳細確認時、ヘルスチェック時"
        note: |
          日本株（.T）では J-Quants の会社予想を自動マージする。追加されるキー:
            forecast_source        "jquants"（会社予想を採用）/ "yfinance"（フォールバック）
            forecast_eps_company   会社予想EPS   / per_forward_company    会社予想ベースのPER
            forecast_dps_company   会社予想年間配当 / dividend_yield_company 会社予想ベースの利回り
            forecast_divergence    yfinanceと会社予想の乖離率
            forecast_suspect       乖離20%超なら True
          ⚠️ **forecast_suspect が True の銘柄は、一次情報（決算短信）を確認するまで
            投資判断に使わない。** forecast_source が "jquants" のときは
            per_forward_company / dividend_yield_company を forward_per / dividend_yield より優先する。
          ⚠️ dividend_yield_suspect（dividendRate と実績DPSの±30%乖離）も別途立つ。
            こちらは実際の増配でも発火するため、否定ではなく確認の合図。
      get_price_history:
        description: "価格履歴取得（RSI・SMA等のテクニカル計算用）"
        when: "テクニカル確認時、ストレステスト時"
        note: |
          ⚠️ yfinance は最新バーの行だけ作って Close=NaN で返すことがある。
          呼び出し側が `df["Close"].dropna()` すると **NaN 行は黙って消え、
          1日古い終値が「最新」として計算に入る**（警告もエラーも出ない）。
          2026-08-15 に保有・計画6銘柄すべてで発生し、RSI・SMA・バンドウォーク・
          半年期日・ストップ距離がすべて1日ずれていた。
          日本株（.T/.S）は `_patch_latest_bar` が J-Quants で自動補完する（KIK-759）。
          米国株・指数・為替は J-Quants の対象外なので補完されない。
          **最新バーの日付は常に確認すること**（checklists.yaml DQ4）。

  grok:
    source: tools/grok.py
    note: |
      ⚠️ **可用性を `os.environ.get("XAI_API_KEY")` で判定してはならない。**
      .env は `src/data/grok_client/_common.py` の import 時に load_dotenv() で読まれるため、
      素の環境変数を先に見ると必ず空に見える。2026-08-09 にこれで「キー未設定」と誤報告した。
      判定は `checklist_review.llm_availability()`（実際に叩く）で行う。
      `is_available()` も鍵の有無しか見ないので可用性の根拠にしない。

      ⚠️ **403 を「キーがない」と読み替えない。** `GET https://api.x.ai/v1/api-key` を叩くと
      `team_blocked` / `api_key_blocked` / `api_key_disabled` / `acls` が分離して返る。
      xAI ではクレジット未購入が `team_blocked: true` として現れ、キー自体は有効なまま 403 になる。

      モデルは2経路で別物。**どちらも変更不要**（2026-08-09 実測）:
        検索系（search_market / search_x_sentiment / bulk_*）
          → `grok_client._DEFAULT_MODEL` = grok-4-1-fast-non-reasoning（$0.2/$0.5・0.9秒）。最安かつ最速
        call_llm("grok", ...)（history_check 等）
          → `config/llm_routing.yaml` の models[0] = grok-4.20-0309-reasoning（$2/$6）。
            投資判断時のみ発火するため月数回。1回$0.02程度で、切り替える実益はない
    functions:
      search_market:
        description: "市場動向・マクロ情報・業界ニュースの検索"
        when: "市況把握時、マクロ調査時"
      search_x_sentiment:
        description: "X(旧Twitter)上の投資家センチメント取得"
        when: "候補の定性評価時、市場心理の確認時"
      bulk_x_search:
        provider: "xAI Grok"
        description: "X firehose 並列センチメント（複数クエリ束ね）"
        when: "投資家センチメント・$cashtag・特定 handle を複数横断する時"
        strength: "X firehose 独占アクセス（他LLM不可）"
        not_for: "公式メディア・SEC（→ gemini.deep_research を使う）"
        cost_per_call_usd: 0.5
        max_calls_per_session: 5
        note: "1クエリあたり sleep(0.5) で rate limit 配慮。max_sources_per_call=10 で sources 課金抑制"
      bulk_web_search:
        provider: "xAI Grok"
        description: "Grok web_search 並列（速報重視・サイトフィルタ可）"
        when: "リアルタイム速報・X反応とWeb反応の対比"
        strength: "Grok の reasoning + web_search 統合"
        not_for: "深い徹底調査（→ gemini.deep_research）"
        cost_per_call_usd: 0.5
        max_calls_per_session: 3
        note: "allowed_domains で site フィルタ可（最大5）"

  graphrag:
    source: tools/graphrag.py
    functions:
      get_context:
        description: "過去の分析・lesson・thesis・観察メモの取得（Neo4j GraphRAG）"
        when: "初回分析時（必須）。銘柄の過去文脈を踏まえた判断に使う"
      sync_all:
        description: "data/ → GraphRAG の一括同期（portfolio + cash + notes + history 8カテゴリ）"
        when: "「syncして」「データを同期して」と言われた時"
        note: |
          実体は src/data/graph_sync.py。毎回フルスキャン（MERGE なので冪等・差分同期は無い）。
          戻り値は件数まで見る: synced の history は {成功}/{全体} 形式。
          failed に「N件中0件同期」= 障害。skipped の NEO4J_MODE=off は設定の問題。
          sync 経路では埋め込み（TEI）を生成しないため、ベクトル検索からは漏れる。

  llm:
    source: tools/llm.py
    functions:
      call_llm:
        description: "外部LLM（GPT/Gemini/Grok）の呼び出し"
        when: "マルチLLMレビュー時、4-Swarm レビュー時"
        note: "モデル名は config/llm_routing.yaml を参照。ハードコード禁止"
      is_provider_available:
        description: "指定プロバイダのAPIキーが設定されているか確認"
        when: "LLM呼び出し前のチェック"
      gemini_deep_research:
        provider: "Google Gemini"
        description: "Gemini Deep Research API: Web 全般を自律巡回（80-160 sources）+ 引用付きレポート生成"
        when: "業界全体像・規制動向・公式IR・SEC・マクロを徹底調査する時"
        strength: "Google Search Grounding。1タスクで多数ソースを統合した深い分析"
        not_for: "X/Twitter内データ（→ grok.bulk_x_search）"
        cost_per_call_usd: 2.5
        max_calls_per_session: 2
        note: "depth=light/medium/heavy。wall_time 30min ハードキャンセル。DEEPTHINK_DR_ENABLED=off で停止"
      is_deep_research_enabled:
        description: "Gemini DR の kill switch 状態確認 (DEEPTHINK_DR_ENABLED)"
        when: "DR 起動前のチェック"

  notes:
    source: tools/notes.py
    functions:
      load_notes:
        description: "教訓(lesson)・投資メモ(thesis/observation)の読込"
        when: "初回分析時（必須）。過去の教訓との照合に使う"
      save_note:
        description: "投資メモ・教訓の保存"
        when: "分析結果から教訓を記録する時"
      check_exit_rule:
        description: "exit-ruleノートの損切り/利確閾値と現在損益率を照合"
        when: "売却判断時（必須）。事前設定した撤退ルールとの照合に使う"

  portfolio_io:
    source: tools/portfolio_io.py
    functions:
      load_portfolio:
        description: "ポートフォリオ保有状況の読込（CSV）"
        when: "PF関連テーマ時（必須）。配分・通貨・ロール分析に使う"
      load_cash_balance:
        description: "キャッシュ残高読込（cash_balance.json）"
        when: "PF総資産計算時（必須）。Cash% 比率算出には load_total_assets 推奨"
        note: "KIK-734: HC/Risk Assessor は cash_balance.json を必ず参照すること"
      load_total_assets:
        description: "PF総資産（株式 + 現金）の SSoT 関数"
        when: "PF総資産・Cash% 計算時（必須）。load_portfolio + load_cash_balance を一括取得"
        note: "KIK-734: 戻り値 {positions, cash, cash_jpy, has_cash}。HC/Risk のキャッシュ参照漏れ防止"

  sanity_gate:
    source: src/data/sanity_gate.py
    functions:
      assert_pf_complete:
        description: "PF総資産計算のキャッシュ参照漏れを assert で防ぐ"
        when: "推奨生成前（必須）。HC/Risk Assessor で PF比率を出す前に通す"
      assert_lot_size:
        description: "JP/SG/JKT/HK/KS 株は100株単位、米株は1株可の assert"
        when: "売買提案時（必須）。一部売却不可な銘柄での桁ミス防止"
      assert_conviction_respected:
        description: "conviction 銘柄への売却・トリム提案禁止 assert"
        when: "売買提案時（必須）。ホールド確定銘柄の保護"
      run_all_gates:
        description: "上記3 gate を一括実行する便利関数"
        when: "PF徹底レビュー・徹底調査・週次routine 実行時"
        note: "KIK-734: 自然言語制約ではなくコード強制。fail で SanityGateError"

  preflight:
    source: src/data/preflight.py
    functions:
      run_preflight:
        description: "DeepThink 起動前/Step5前のゲート（cash_balance / conviction / lot_size を一括検証）"
        when: "DeepThink Step 0 と Step 5 直前（必須）。PF系テーマでは domain='pf'"
        note: "KIK-735: sanity_gate のラッパー。conviction は data/notes/thesis から自動抽出"
      extract_convictions:
        description: "thesis ノートから conviction 銘柄リストを抽出"
        when: "Strategist/Reviewer 起動時に conviction 注入用に取得"

  watchlist:
    source: tools/watchlist.py
    functions:
      load_watchlist:
        description: "ウォッチリスト読込"
        when: "ウォッチ中銘柄の参照時"

  scoring:
    source: tools/scoring.py
    functions:
      score_quality:
        description: "個別銘柄の3軸品質スコア（還元性・成長性・持続性）+ 4象限分類"
        when: "銘柄の質を定量評価する時、入替候補の比較時"
      score_portfolio:
        description: "PF全銘柄の一括スコアリング + 4象限分類（保有/買い増し/要監視/売却検討）"
        when: "PF全体の品質評価、要監視銘柄の特定時"

  news_rss:
    source: tools/news_rss.py
    functions:
      search_market_rss:
        description: "Google News + NHK経済ニュース RSS で市況ニュースを取得（Grok代替）"
        when: "Grok API 利用不可時のニュース取得。grok.search_market() が自動でフォールバック"
      fetch_google_news:
        description: "Google News RSS でキーワード検索（銘柄名・テーマ等）"
        when: "特定銘柄・テーマのニュース直接取得時"
      fetch_nhk_news:
        description: "NHK経済ニュース RSS 取得（マクロ・政策ニュース）"
        when: "マクロ経済・政策ニュースの取得時"

  jquants:
    source: tools/jquants.py
    note: |
      JPX公式データ（日本株のみ）。**日本株の会社予想はここを一次情報とする。**
      2026-08-05 の実測で、yfinance の予想値は検証5銘柄中2件（40%）が誤りだった:
        6436.T アマノ  dividendRate 250円（会社予想180円）→ 利回りを6.44%と誤認し推奨に載せた
        6701.T 日本電気 forwardEps 718.96（会社予想の約3.3倍）→ 予想PER 6.4 と誤認
      J-Quants は決算短信そのものなので、取得できる限りこちらが正しい。
      米国株・指数・為替・商品は yahoo_finance を使うこと（J-Quantsは日本株のみ）。
    functions:
      get_company_forecast:
        description: "決算短信の会社予想（予想EPS・予想年間配当・予想売上/営業利益/純利益）と実績を取得"
        when: "日本株の予想PER・予想配当利回りを出す時。**発注前の検証では必須**"
        note: |
          IFRS/Non-GAAP開示だと予想EPS/純利益が空になる（実測: 6701 日本電気 /
          4568 第一三共 / 9364 上組）。has_forecast=False の場合は yfinance にフォールバックする。
          値が取れないことを「間違った値」で埋めないのが設計意図。
      get_forecast_history:
        description: "会社予想の改訂履歴（新しい順）。上方修正・下方修正の追跡に使う"
        when: "業績モメンタムの方向を確認する時"
      get_daily_bars:
        description: "日足OHLCV（JPX公式・調整後価格優先）"
        when: "日本株のテクニカル計算時。yfinanceが最新バーをClose=nullで返す不具合の回避にも使う"
      get_next_earnings:
        description: "公表済みの決算発表予定日"
        when: "決算前後の判断時"
        note: |
          ⚠️ カレンダーは**翌営業日1日分のみ**の公表。None は「当面決算がない」ではなく
          「直近の公表枠に載っていない」を意味する。数ヶ月先の予定は yahoo_finance の
          next_earnings（推定値・earnings_date_estimated フラグ付き）を使う。
      get_earnings_calendar:
        description: "翌営業日に決算発表する全銘柄の一覧"
        when: "保有・ウォッチリストと突合して明日の決算を洗い出す時"
      get_company_names:
        description: "銘柄コード → **日本語社名** の一括取得（上場銘柄マスタ）"
        when: |
          **銘柄一覧を出力するときは必ず使う**（日次・週次・月次・スクリーニング結果）。
          yfinance の name は英語表記（"CANON INC" / "TOSO CO LTD"）しか返さない。
          日本語名を記憶や推測で書かない — 2026-08-13 まで手書きしており、
          6501.T を「日立」と書いていた（正しくは「日立製作所」）。
        note: |
          取れなかった銘柄は **symbol をそのまま値に返す**（空文字にしない）。
          J-Quants 未設定・ネットワーク断でも銘柄名が消えたレポートにはならない。
          上場マスタ4,443件はプロセス内に1回だけ載せる。
      get_listed_info:
        description: "日本語社名・33業種・市場区分（プライム/スタンダード）・規模区分（TOPIX Core30等）"
        when: "セクター分散の判定時、規模ティアの確認時。yfinance の sector は英語かつ粒度が粗い"
      get_stock_margin:
        description: "個別銘柄の週次信用取引残高（信用倍率・買い残・売り残・前週比）を取得"
        when: |
          **発注前は必須**（checklists.yaml PO7）。日次チェックでも保有銘柄について確認する。
          信用倍率 = 買い残 ÷ 売り残。大きいほど上値で戻り売りに押される。
          バリュエーションと値動きだけを見ていると完全に抜ける軸。
        note: |
          判断基準: 15倍以上=やや厚い / 30倍以上=上値の重石として明確 / 前週比+50%超=急増
          detect_alerts(margins=...) に渡すと margin_heavy / margin_extreme / margin_surge を自動判定する。
          実測（2026-07-31）: 8031.T 三井物産 38.5倍 / 6701.T 日本電気 20.3倍 /
                            7453.T 良品計画 1.56倍 / 6501.T 日立 8.79倍（前週比-62.3%）
          Standard プラン以上必要。JQUANTS_API_KEY / JQUANTS_API_REFRESH_TOKEN で認証

  jpx:
    source: tools/jpx.py
    functions:
      get_demand_supply:
        description: "需給動向の全指標（信用残高・投資主体別売買・空売り出来高）をまとめて取得"
        when: "市況チェック時、需給セクション表示時"
      get_margin:
        description: "信用取引残高（信用倍率・前週比）の取得"
        when: "信用倍率の個別確認時"
      get_investor_type:
        description: "投資主体別売買動向（外国人・個人・投信の純売買）の取得"
        when: "外国人動向の個別確認時"
      get_short_selling:
        description: "空売り出来高と前日比の取得"
        when: "空売り圧力の個別確認時"

  morning_summary:
    source: tools/morning_summary.py
    functions:
      detect_alerts:
        description: "PF全銘柄の数値ベース異常検知（exit-rule/RSI/決算接近/VIX）"
        when: "朝サマリー時、PFの異常有無を確認する時"
      format_morning_summary:
        description: "異常検知結果を1分で読めるサマリーにフォーマット"
        when: "detect_alertsの結果を人間向けに整形する時"

  edinet:
    source: tools/edinet.py
    functions:
      get_large_shareholding:
        description: "大量保有報告書・変更報告書を日次取得（提出者名・対象銘柄・ティッカー付き）"
        when: "機関投資家の大量保有動向を確認する時、特定銘柄への大口買いを検知する時"
        note: "EDINET_API_KEY 環境変数で認証（無料登録）。未設定時は空リストを返す"
      get_disclosures:
        description: "書類種別（keyword）または銘柄（ticker）で開示書類を検索"
        when: "特定銘柄の有価証券報告書・四半期報告書等を探す時"
      get_document_list:
        description: "指定日の全提出書類一覧を取得（フィルタなし）"
        when: "特定日の開示書類を網羅的に確認する時"

  notebooklm:
    source: "MCP (notebooklm-mcp) — tools/ にファサードは作らない"
    note: |
      Google NotebookLM（2026-07-16 に **Gemini Notebook** へ改名、URL は notebook.google.com）を
      MCP 経由で参照する。ユーザーがアップロードした資料に根拠を限定した回答が返る。

      **ライブラリ（4冊）と実行時参照の可否:**

      | notebook_id | 内容 | 実行時参照 |
      |:---|:---|:---|
      | kiyohara-net-cash-investing | 清原達郎 ネットキャッシュ投資法 | **可**（トリガー条件付き） |
      | sho-nikkei-technical-and-suppl | Sho's投資情報局 日経平均テクニカル・需給 | 不可（実装時に定着済み） |
      | uki-quant-trading-methods-uki | UKI クオンツ手法（統計・機械学習・板読み） | 不可（未接続） |
      | beginner-stock-investing-lectu | 株初心者向け講義9本 | **不可（接続しない）** |

      ⚠️ **実行時に呼んでよいのは清原ノートブックのみ。** `ask_question` は実測 15〜40秒かかり、
      無料枠は 50クエリ/日。日次ルーティン（朝サマリー・PFヘルスチェック等）の同期パスに入れると
      体感が明確に悪化する。Sho / UKI の知見は**実装時に1回引いて判定ロジックとして定着させる**
      （例: #160 大底圏シグナル、バンドウォーク終了判定）。

      ⚠️ beginner-stock-investing-lectu はスクリーニング基準（時価総額500億円以上・自己資本比率
      50%以上・配当3〜4%）が清原式（500億円未満の小型株）と矛盾する。ユーザーが明示的に
      指定した時だけ手動で引く。エージェントの自動トリガーには入れない。

      **ソースが矛盾したときの優先順位: 軸ごとに分ける**（2026-08-11 ユーザー判断）

      2026-08-09 は「清原を一括で主軸」としたが、**宣言と実態が乖離していた**。
      保有・計画7銘柄はすべて大型株（Sho のユニバース）で、清原のユニバース
      （500億円未満の小型株）は一度も買っていない。軸ごとに主従を決め直す。

      | 軸 | 主軸 | 理由 |
      |:---|:---|:---|
      | 対象ユニバース | **Sho**（大型・日経225構成） | 実際に買っているのがこれ。テクニカルが効きやすい |
      | タイミング・需給 | **Sho** | 清原はタイミングを扱わない |
      | 執行方法（打診買い・段階・倍買い） | **Sho** | #160 で実装済み |
      | 割安の測り方 | **清原**（ネットキャッシュ比率） | Sho の PBR 単独は清原がバリュートラップと警告 |
      | 利食い規律 | **清原**（3割で売らない・最低2倍） | Sho の1%回転とは前提が違う |
      | バリュートラップ回避 | **清原** | 固定資産中心の見せかけ割安を弾く |

      ⚠️ **Sho のデイトレード部分（9:00〜10:00の回転売買）は不採用。**
      月1回・冷却4週の設計と両立しない。2026-08-04 / 08-10 に注文種別の入力ミスが
      2件起きており、発注頻度を上げると比例して増える。

      ⚠️ **Sho の「配当利回り4%以上」は参考値にとどめる。** 保有・計画7銘柄すべてが
      未達（最高がキヤノン3.46%）。文字どおり採用すると投入計画が全崩れする。

      ⚠️ 清原候補は `kiyohara_netcash` WL の別枠監視として維持する。growth 枠を
      小型株で埋めようとすると量が足りず数字合わせになる（ユーザー既決）。

      ⚠️ 信用倍率の閾値（15倍/30倍）は**据え置き**。清原の資料に信用倍率の基準は無く、
      初心者講義の「10倍超は危険」を採る理由がないため。この閾値は当システム独自のもの。

      ⚠️ ノートブック追加時は **name に必ず ASCII を含める**。notebooklm-mcp の generateId() が
      name を `[^a-z0-9]+` でスラグ化するため、日本語のみの name は id が空文字列になり
      `ask_question` から参照できなくなる（実際に発生済み）。
    functions:
      search_notebooks:
        description: "ライブラリをキーワード検索し、notebook_id を取得（name/description/topics/tags を対象）"
        when: "ノートブックを id ではなくトピックで特定する時。上表の id を直接使ってもよい"
      ask_question:
        description: "ノートブックに質問し、ソース根拠付きの回答を取得"
        when: |
          清原式のネットキャッシュ基準を取得する時（screener / analyst のトリガー条件を満たした場合のみ）。
          source_format="footnotes" で引用付き。session_id を渡すと文脈を保った追質問ができる。
      list_notebooks:
        description: "登録済みノートブックの一覧とメタデータを取得"
        when: "ライブラリの現状を確認する時"
      get_health:
        description: "認証状態・アクティブノートブック・セッション数の確認"
        when: "NotebookLM 参照が失敗した時の切り分け（authenticated=false なら setup_auth）"
